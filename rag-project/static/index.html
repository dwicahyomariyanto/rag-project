<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniRAG — Demo Chat RAG</title>
<style>
  :root {
    --bg: #f5f6fa; --card: #ffffff; --ink: #1c2333; --muted: #6b7280;
    --accent: #4f46e5; --accent-soft: #eef2ff; --border: #e5e7eb;
    --ok: #059669; --warn: #b45309;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); height: 100vh;
         display: flex; flex-direction: column; }
  header { background: var(--card); border-bottom: 1px solid var(--border);
           padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 17px; font-weight: 700; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 999px;
           background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  #health { margin-left: auto; font-size: 12px; color: var(--muted); }
  main { flex: 1; display: flex; min-height: 0; }
  /* ---------- sidebar dokumen ---------- */
  aside { width: 280px; background: var(--card); border-right: 1px solid var(--border);
          padding: 16px; overflow-y: auto; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
             color: var(--muted); margin-bottom: 10px; }
  .upload-box { border: 2px dashed var(--border); border-radius: 10px; padding: 14px;
                text-align: center; cursor: pointer; font-size: 13px; color: var(--muted);
                transition: border-color .15s; }
  .upload-box:hover { border-color: var(--accent); color: var(--accent); }
  .doc-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
              border: 1px solid var(--border); border-radius: 8px; margin-top: 8px;
              font-size: 12.5px; }
  .doc-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-item .n { color: var(--muted); font-size: 11px; }
  .doc-item button { border: none; background: none; color: #dc2626; cursor: pointer;
                     font-size: 14px; }
  /* ---------- chat ---------- */
  section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex;
              flex-direction: column; gap: 14px; }
  .msg { max-width: 78%; padding: 12px 16px; border-radius: 14px; font-size: 14.5px;
         line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff;
              border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card);
             border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .cite { font-size: 11.5px; background: var(--accent-soft); color: var(--accent);
          border-radius: 6px; padding: 3px 8px; cursor: default; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin: auto; }
  /* ---------- composer ---------- */
  form { display: flex; gap: 10px; padding: 14px 20px; background: var(--card);
         border-top: 1px solid var(--border); }
  input[type=text] { flex: 1; border: 1px solid var(--border); border-radius: 10px;
                     padding: 11px 14px; font-size: 14px; outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  button.send { background: var(--accent); color: #fff; border: none; border-radius: 10px;
                padding: 11px 22px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: wait; }
  label.stream { font-size: 12.5px; color: var(--muted); display: flex;
                 align-items: center; gap: 5px; user-select: none; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
           background: var(--ink); color: #fff; font-size: 13px; padding: 10px 18px;
           border-radius: 10px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 760px) { aside { display: none; } }
</style>
</head>
<body>
<header>
  <h1>MiniRAG</h1>
  <span class="badge">RAG + Hybrid Search + Rerank</span>
  <span id="health">memuat status…</span>
</header>

<main>
  <aside>
    <h2>Dokumen</h2>
    <div class="upload-box" id="uploadBox">
      📄 Klik untuk unggah PDF<br><small>diproses otomatis via /api/documents/ingest</small>
    </div>
    <input type="file" id="fileInput" accept=".pdf" hidden>
    <div id="docList"></div>
  </aside>

  <section>
    <div id="messages">
      <div class="hint">Unggah PDF di panel kiri, lalu ajukan pertanyaan tentang isinya.</div>
    </div>
    <form id="chatForm">
      <input type="text" id="question" placeholder="Contoh: berapa lama cuti tahunan?" autocomplete="off">
      <label class="stream"><input type="checkbox" id="streamToggle" checked> streaming</label>
      <button class="send" id="sendBtn" type="submit">Kirim</button>
    </form>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const messagesEl = $("messages");

function toast(text) {
  const t = $("toast");
  t.textContent = text; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}
function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }
function addBubble(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  messagesEl.appendChild(div); scrollDown();
  return div;
}
function addCitations(bubble, cites) {
  if (!cites || !cites.length) return;
  const wrap = document.createElement("div");
  wrap.className = "cites";
  for (const c of cites) {
    const chip = document.createElement("span");
    chip.className = "cite";
    chip.textContent = `[${c.id}] ${c.source_name} · hal. ${c.page_start}${c.page_end !== c.page_start ? "-" + c.page_end : ""}`;
    chip.title = c.snippet;
    wrap.appendChild(chip);
  }
  bubble.appendChild(wrap);
}

/* ---------------- health & dokumen ---------------- */
async function loadHealth() {
  try {
    const r = await fetch("/api/health");
    const h = await r.json();
    $("health").textContent =
      `${h.num_chunks} chunks · ${h.num_sources} dokumen · LLM:${h.llm_backend} · embed:${h.embedding_backend} · rerank:${h.reranker_backend}`;
  } catch { $("health").textContent = "API tidak terjangkau"; }
}
async function loadDocs() {
  const r = await fetch("/api/documents");
  const docs = await r.json();
  const list = $("docList"); list.innerHTML = "";
  for (const d of docs) {
    const item = document.createElement("div");
    item.className = "doc-item";
    item.innerHTML = `<span class="name" title="${d.source_id}">📄 ${d.source_name}</span>
                      <span class="n">${d.num_chunks} ch</span>`;
    const del = document.createElement("button");
    del.textContent = "✕"; del.title = "Hapus dokumen";
    del.onclick = async () => {
      await fetch("/api/documents/" + d.source_id, { method: "DELETE" });
      toast("Dokumen dihapus"); loadDocs(); loadHealth();
    };
    item.appendChild(del); list.appendChild(item);
  }
}
$("uploadBox").onclick = () => $("fileInput").click();
$("fileInput").onchange = async () => {
  const file = $("fileInput").files[0];
  if (!file) return;
  const fd = new FormData(); fd.append("file", file);
  toast("Mengunggah & mengindeks " + file.name + " …");
  const r = await fetch("/api/documents/ingest", { method: "POST", body: fd });
  const body = await r.json();
  if (r.ok) {
    toast(`Selesai: ${body.num_chunks} chunks dari ${body.num_pages} halaman (${body.status})`);
  } else { toast("Gagal: " + (body.detail || r.status)); }
  $("fileInput").value = ""; loadDocs(); loadHealth();
};

/* ---------------- chat ---------------- */
$("chatForm").onsubmit = async (e) => {
  e.preventDefault();
  const q = $("question").value.trim();
  if (!q) return;
  $("question").value = ""; $("sendBtn").disabled = true;
  addBubble("user", q);
  const bot = addBubble("bot", "…");
  const useStream = $("streamToggle").checked;

  try {
    if (useStream) {
      const resp = await fetch("/api/chat/stream", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q }),
      });
      bot.textContent = "";
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "", event = "message";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf("\n\n")) !== -1) {
          const raw = buffer.slice(0, idx); buffer = buffer.slice(idx + 2);
          let data = null;
          for (const line of raw.split("\n")) {
            if (line.startsWith("event: ")) event = line.slice(7).trim();
            else if (line.startsWith("data: ")) data = JSON.parse(line.slice(6));
          }
          if (!data) continue;
          if (event === "token") { bot.textContent += data.delta; scrollDown(); }
          else if (event === "sources") { addCitations(bot, data.citations); }
          else if (event === "error") { bot.textContent += "\n[error] " + data.detail; }
        }
      }
    } else {
      const resp = await fetch("/api/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q }),
      });
      const body = await resp.json();
      if (resp.ok) {
        bot.textContent = body.answer;
        addCitations(bot, body.citations);
      } else { bot.textContent = "Error: " + (body.detail || resp.status); }
    }
  } catch (err) {
    bot.textContent = "Gagal terhubung ke API: " + err;
  } finally {
    if (bot.textContent === "…") bot.textContent = "(tidak ada jawaban)";
    $("sendBtn").disabled = false; $("question").focus(); scrollDown();
  }
};

loadHealth(); loadDocs();
</script>
</body>
</html>
